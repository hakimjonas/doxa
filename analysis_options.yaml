# Monorepo root — analysis is configured per-package.
# Each sub-package (doxa/, doxa_tooling/) has its own
# analysis_options.yaml with lints and strict mode settings.
#
# This file exists only to suppress Dart analyzer from walking
# further up the filesystem tree for configuration.
analyzer:
  exclude:
    - "**/*.doxa"
    - "**/*.mjs"
