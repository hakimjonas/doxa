<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doxa — Browser Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; }
  textarea { width: 100%; height: 240px; font-family: monospace; font-size: 0.9rem; margin: 0.5rem 0; }
  button { font-size: 1rem; padding: 0.4rem 1rem; }
  pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; white-space: pre-wrap; }
  .success { color: green; }
  .error { color: red; }
</style>
</head>
<body>

<h1>Doxa Proof Checker</h1>
<p>Paste Doxa source below and click <em>Check</em>. The prelude (<code>Eq</code>) is loaded automatically.</p>

<textarea id="source" spellcheck="false">data Nat : Type {
  zero : Nat;
  succ : Nat -> Nat;
}

fun plus(m: Nat, n: Nat): Nat = match m {
  case zero => n
  case succ m_ => succ (plus m_ n)
}

val zero_plus_n : (n: Nat) -> Eq[Nat] (plus zero n) n =
  (n: Nat) => refl n
</textarea>

<p><button id="check-btn">Check</button></p>

<pre id="output"></pre>

<script type="module">
  import { doxaCheck } from './doxa_check.mjs';

  const sourceEl = document.getElementById('source');
  const outputEl = document.getElementById('output');
  const btn = document.getElementById('check-btn');

  btn.addEventListener('click', () => {
    try {
      const json = doxaCheck(sourceEl.value);
      const result = JSON.parse(json);
      if (result.status === 'success') {
        outputEl.className = 'success';
        outputEl.textContent =
          'OK: ' + result.count + ' ' + (result.count === 1 ? 'declaration' : 'declarations') + ' checked';
      } else {
        outputEl.className = 'error';
        outputEl.textContent = result.message;
      }
    } catch (e) {
      outputEl.className = 'error';
      outputEl.textContent = 'Error: ' + e.message;
    }
  });
</script>

</body>
</html>
