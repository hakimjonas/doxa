name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # --- Build native binaries for each target platform ---
  #
  # dart compile exe targets the host platform, so each target needs
  # its own runner. The matrix matches the lambe release matrix.
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check VERSION matches the tag
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the local dev SDK (see ci.yml), so the binaries
          # match CI-verified behavior.
          sdk: 3.13.1

      - name: Install tooling dependencies against the local kernel
        working-directory: ./doxa_tooling
        run: |
          printf 'dependency_overrides:\n  doxa:\n    path: ../doxa\n' > pubspec_overrides.yaml
          dart pub get

      - name: Build native binary
        working-directory: ./doxa_tooling
        shell: bash
        run: |
          mkdir -p dist
          dart compile exe bin/doxa.dart -o dist/doxa-${{ matrix.target }}${{ matrix.exe }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxa-${{ matrix.target }}
          path: doxa_tooling/dist/doxa-${{ matrix.target }}${{ matrix.exe }}

  # --- Create the GitHub release from the built binaries ---
  github-release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          pattern: doxa-*
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd release-binaries
          # One SHA256 per line, sha256sum format, covering every
          # downloaded binary including the Windows .exe.
          sha256sum doxa-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Doxa ${{ github.ref_name }}
          body: |
            Doxa ${{ github.ref_name }} — a dependently typed proof checker.

            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            release-binaries/*
          draft: false
          prerelease: false
