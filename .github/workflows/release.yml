name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Doxa ${{ github.ref_name }}
          body: |
            Doxa ${{ github.ref_name }} — a dependently typed proof checker.

            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
