name: Release

on:
  push:
    tags: ['v*']

jobs:
  # --- Build native binaries for each target platform ---
  #
  # dart compile exe targets the host platform, so each target needs
  # its own runner. macos-x64 was dropped: the macos-13 runner image
  # is retired and x64 macOS images now only exist as paid large
  # runners.
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the local dev SDK (see ci.yml), so the binaries
          # match CI-verified behavior.
          sdk: 3.13.1

      - name: Build native binary
        working-directory: ./doxa_tooling
        run: |
          mkdir -p dist
          dart compile exe bin/doxa.dart -o dist/doxa-${{ matrix.target }}

      - name: Package binary
        run: tar -czf doxa-${{ matrix.target }}.tar.gz -C doxa_tooling/dist doxa-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxa-${{ matrix.target }}
          path: doxa-${{ matrix.target }}.tar.gz

  # --- Build and publish Dart packages ---
  publish-dart:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the local dev SDK (see ci.yml).
          sdk: 3.13.1

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          pattern: doxa-*
          merge-multiple: true

      - name: Publish to pub.dev (doxa kernel)
        run: |
          dart pub publish --directory doxa/ --force || true

      - name: Publish to pub.dev (doxa_tooling)
        run: |
          dart pub publish --directory doxa_tooling/ --force || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Doxa ${{ github.ref_name }}
          body: |
            Doxa ${{ github.ref_name }} — a dependently typed proof checker.

            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: release-binaries/*.tar.gz
          draft: false
          prerelease: false

  # --- Publish VSCode extension ---
  publish-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install + build + publish
        working-directory: ./editors/vscode
        run: |
          npm ci
          npm run esbuild
          npx @vscode/vsce publish --packagePath $(ls *.vsix 2>/dev/null) || true

  # --- Publish JetBrains plugin ---
  publish-jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and publish
        working-directory: ./editors/jetbrains
        run: |
          ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
