name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # --- Build native binaries for each target platform ---
  #
  # dart compile exe targets the host platform, so each target needs
  # its own runner. The matrix matches the lambe release matrix.
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    # Tag pushes only: a manual dispatch publishes the VS Code
    # extension, not fresh binaries or releases.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the local dev SDK (see ci.yml), so the binaries
          # match CI-verified behavior.
          sdk: 3.13.1

      - name: Install tooling dependencies against the local kernel
        working-directory: ./doxa_tooling
        run: |
          printf 'dependency_overrides:\n  doxa:\n    path: ../doxa\n' > pubspec_overrides.yaml
          dart pub get

      - name: Build native binary
        working-directory: ./doxa_tooling
        shell: bash
        run: |
          mkdir -p dist
          dart compile exe bin/doxa.dart -o dist/doxa-${{ matrix.target }}${{ matrix.exe }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxa-${{ matrix.target }}
          path: doxa_tooling/dist/doxa-${{ matrix.target }}${{ matrix.exe }}

  # --- Build and publish Dart packages ---
  publish-dart:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the local dev SDK (see ci.yml).
          sdk: 3.13.1

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          pattern: doxa-*
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd release-binaries
          # One SHA256 per line, sha256sum format, covering every
          # downloaded binary including the Windows .exe.
          sha256sum doxa-* > checksums.txt
          cat checksums.txt

      - name: Publish to pub.dev (doxa kernel)
        run: |
          is_published() {
            local package="$1"
            local version="$2"
            local body
            if ! body="$(curl -fsS "https://pub.dev/api/packages/$package")"; then
              return 1
            fi
            printf '%s' "$body" \
              | jq -e --arg v "$version" '.versions[] | select(.version == $v)' >/dev/null
          }

          version="$(cat VERSION)"
          if is_published doxa "$version"; then
            echo "doxa $version is already published; skipping."
          else
            dart pub publish --directory doxa/ --force
          fi

      - name: Publish to pub.dev (doxa_tooling)
        run: |
          is_published() {
            local package="$1"
            local version="$2"
            local body
            if ! body="$(curl -fsS "https://pub.dev/api/packages/$package")"; then
              return 1
            fi
            printf '%s' "$body" \
              | jq -e --arg v "$version" '.versions[] | select(.version == $v)' >/dev/null
          }

          version="$(cat VERSION)"
          if is_published doxa_tooling "$version"; then
            echo "doxa_tooling $version is already published; skipping."
            exit 0
          fi

          # The tooling publish resolves doxa from pub.dev. Poll the
          # kernel index briefly after a fresh publish.
          for attempt in $(seq 1 12); do
            if is_published doxa "$version"; then
              break
            fi
            echo "waiting for doxa $version in the pub.dev index (attempt $attempt/12)."
            sleep 10
          done

          attempt=1
          until dart pub publish --directory doxa_tooling/ --force; do
            if [ "$attempt" -ge 6 ]; then
              echo "doxa_tooling publish failed after $attempt attempts." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "doxa_tooling publish failed; retrying in 10s (attempt $attempt/6)."
            sleep 10
          done

      # Run immediately after both publishes. If pub.dev's package index
      # has not caught up, rerun the job; do not remove this gate.
      - name: pana score (published)
        run: |
          dart pub global activate pana
          attempt=1
          until pana doxa/ --source hosted --exit-code-threshold 0 \
            && pana doxa_tooling/ --source hosted --exit-code-threshold 0; do
            if [ "$attempt" -ge 12 ]; then
              echo "pana gate failed after $attempt attempts." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "pana failed; retrying in 10s (attempt $attempt/12)."
            sleep 10
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Doxa ${{ github.ref_name }}
          body: |
            Doxa ${{ github.ref_name }} — a dependently typed proof checker.

            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            release-binaries/*
          draft: false
          prerelease: false

  # --- Publish VSCode extension ---
  publish-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./editors/vscode
        run: npm ci

      - name: Package and publish
        working-directory: ./editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce package
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set; packaged the extension but skipped publication."
            exit 0
          fi
          npx @vscode/vsce publish

  # --- Publish JetBrains plugin ---
  publish-jetbrains:
    runs-on: ubuntu-latest
    # Tag pushes only: publication waits for the marketplace token; a
    # manual dispatch is reserved for the VS Code extension. Set the
    # SKIP_JETBRAINS_PUBLISH repository variable to true when the
    # version is already on the marketplace.
    if: github.event_name == 'push' && vars.SKIP_JETBRAINS_PUBLISH != 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and publish
        working-directory: ./editors/jetbrains
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "JETBRAINS_MARKETPLACE_TOKEN not set; skipping plugin publication."
            exit 0
          fi
          ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
