name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # --- Dart kernel + tooling ---
  doxa-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the local dev SDK (3.13.1): formatter output differs between Dart
          # releases, so an unpinned `stable` breaks the format gate whenever a
          # new Dart ships. Bump together with local SDK upgrades.
          sdk: 3.13.1

      - name: Install dependencies (doxa kernel)
        working-directory: ./doxa
        run: dart pub get

      - name: Use the local doxa kernel
        working-directory: ./doxa_tooling
        run: |
          printf 'dependency_overrides:\n  doxa:\n    path: ../doxa\n' > pubspec_overrides.yaml

      - name: Install dependencies (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart pub get

      - name: Install dependencies (doxa_stdlib)
        working-directory: ./doxa_stdlib
        run: dart pub get

      - name: Analyze (doxa kernel)
        working-directory: ./doxa
        run: dart analyze --no-fatal-warnings

      - name: Analyze (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart analyze --no-fatal-warnings

      - name: Analyze (doxa_stdlib)
        working-directory: ./doxa_stdlib
        run: dart analyze --no-fatal-warnings

      - name: Install dependencies (root, for tool/)
        run: dart pub get

      - name: Analyze (tool harnesses)
        run: dart analyze tool

      - name: Format check (Dart)
        run: dart format --set-exit-if-changed doxa/ doxa_tooling/ doxa_stdlib/ tool/

      - name: Test (doxa kernel)
        working-directory: ./doxa
        run: dart test

      - name: Test (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart test

      # The stdlib package test drives the sibling CLI when it is present.
      - name: Test (doxa_stdlib)
        working-directory: ./doxa_stdlib
        run: dart test

      - name: Build doxa CLI
        working-directory: ./doxa_tooling
        run: dart compile exe bin/doxa.dart -o /tmp/doxa

      - name: doxa fmt --check (all parseable .doxa files)
        run: |
          for f in $(find doxa_stdlib/lib/stdlib doxa_stdlib/example example \
            doxa_tooling/test/programs -name '*.doxa' -type f \
            ! -path 'doxa_tooling/test/programs/negative/block_no_result.doxa' \
            ! -path 'doxa_tooling/test/programs/negative/parse_error.doxa'); do
            /tmp/doxa fmt --check "$f" || exit 1
          done

      - name: doxa type-check (stdlib)
        run: |
          for f in $(find doxa_stdlib/lib/stdlib -name '*.doxa' -type f \
            ! -name 'prelude.doxa'); do
            /tmp/doxa check "$f" || exit 1
          done

      - name: doxa type-check (examples)
        run: |
          for f in example/*.doxa doxa_stdlib/example/*.doxa; do
            /tmp/doxa check "$f" || exit 1
          done

      - name: Build WASM
        working-directory: ./doxa_tooling
        run: dart compile wasm web/doxa_check.dart -o web/doxa_check.wasm

  # --- VSCode extension ---
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./editors/vscode
        run: npm ci

      - name: Test extension adapter
        working-directory: ./editors/vscode
        run: npm test

      - name: Bundle with esbuild
        working-directory: ./editors/vscode
        run: npm run esbuild

      - name: Package extension
        working-directory: ./editors/vscode
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxa-vscode
          path: editors/vscode/*.vsix

  # --- JetBrains plugin ---
  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1

      - name: Install dependencies (doxa kernel)
        working-directory: ./doxa
        run: dart pub get

      - name: Use the local doxa kernel
        working-directory: ./doxa_tooling
        run: |
          printf 'dependency_overrides:\n  doxa:\n    path: ../doxa\n' > pubspec_overrides.yaml

      - name: Install dependencies (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart pub get

      - name: Build doxa CLI
        working-directory: ./doxa_tooling
        run: dart compile exe bin/doxa.dart -o /tmp/doxa

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Test plugin against Doxa LSP
        working-directory: ./editors/jetbrains
        env:
          DOXA_EXECUTABLE: /tmp/doxa
        run: ./gradlew test buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxa-jetbrains
          path: editors/jetbrains/build/distributions/*.zip

  # --- Zed extension ---
  zed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build the extension crate
        working-directory: ./editors/zed
        run: cargo build --target wasm32-wasip2 --release

      - name: Check the extension license
        run: test -s editors/zed/LICENSE

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10

      - name: Check out the pinned grammar
        run: |
          rev=$(sed -n 's/^rev = "\(.*\)"/\1/p' editors/zed/extension.toml)
          test -n "$rev"
          git clone --quiet https://github.com/hakimjonas/tree-sitter-doxa /tmp/tree-sitter-doxa
          git -C /tmp/tree-sitter-doxa checkout --quiet "$rev"

      - name: Test the grammar
        working-directory: /tmp/tree-sitter-doxa
        run: tree-sitter test

      - name: Compile the Zed queries against the grammar
        working-directory: /tmp/tree-sitter-doxa
        run: |
          for q in highlights brackets indents outline; do
            tree-sitter query "$GITHUB_WORKSPACE/editors/zed/languages/doxa/$q.scm" \
              "$GITHUB_WORKSPACE/editors/vscode/test/fixtures/manual-workspace/main.doxa" \
              > /dev/null
          done

  # --- pana score ---
  pub-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1

      - name: pana score (doxa kernel)
        run: |
          dart pub global activate pana
          pana doxa/ --no-warning --exit-code-threshold 0 2>&1 | tail -20

      - name: Use the local doxa kernel
        working-directory: ./doxa_tooling
        run: |
          printf 'dependency_overrides:\n  doxa:\n    path: ../doxa\n' > pubspec_overrides.yaml

      # Pre-release only: hosted doxa 0.8.4 does not exist until the
      # release workflow publishes the kernel. This check is non-fatal;
      # release.yml runs pana against the hosted packages after all
      # three publishes.
      - name: pana score (doxa_tooling)
        run: |
          pana doxa_tooling/ --no-warning --source path --exit-code-threshold 0 2>&1 | tail -20 || true

      # The stdlib package has no runtime dependencies, so pana can
      # resolve it without the kernel. Fatal: a regression here is a
      # packaging bug, not a pending publish.
      - name: pana score (doxa_stdlib)
        run: |
          pana doxa_stdlib/ --no-warning --source path --exit-code-threshold 0 2>&1 | tail -20

  # Preserve the branch-protection context while requiring every CI job.
  test:
    needs: [doxa-core, vscode, jetbrains, zed, pub-score]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI jobs
        env:
          DOXA_CORE_RESULT: ${{ needs['doxa-core'].result }}
          VSCODE_RESULT: ${{ needs.vscode.result }}
          JETBRAINS_RESULT: ${{ needs.jetbrains.result }}
          ZED_RESULT: ${{ needs.zed.result }}
          PUB_SCORE_RESULT: ${{ needs['pub-score'].result }}
        run: |
          test "$DOXA_CORE_RESULT" = success
          test "$VSCODE_RESULT" = success
          test "$JETBRAINS_RESULT" = success
          test "$ZED_RESULT" = success
          test "$PUB_SCORE_RESULT" = success
