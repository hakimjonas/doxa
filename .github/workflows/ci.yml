name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # --- Dart kernel + tooling ---
  doxa-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (doxa kernel)
        working-directory: ./doxa
        run: dart pub get

      - name: Install dependencies (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart pub get

      - name: Analyze (doxa kernel)
        working-directory: ./doxa
        run: dart analyze --no-fatal-warnings

      - name: Analyze (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart analyze --no-fatal-warnings

      - name: Format check (Dart)
        run: dart format --set-exit-if-changed doxa/ doxa_tooling/

      - name: Test (doxa kernel)
        working-directory: ./doxa
        run: dart test

      - name: Test (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart test

      - name: Build doxa CLI
        working-directory: ./doxa_tooling
        run: dart compile exe bin/doxa.dart -o /tmp/doxa

      - name: doxa fmt --check (all .doxa files)
        run: |
          for f in $(find lib/stdlib example doxa_tooling/test/programs -name '*.doxa' -type f); do
            /tmp/doxa fmt --check "$f" || exit 1
          done

      - name: doxa type-check (stdlib)
        run: |
          for f in $(find lib/stdlib -name '*.doxa' -type f ! -name 'prelude.doxa'); do
            /tmp/doxa check "$f" || exit 1
          done

      - name: doxa type-check (examples)
        run: |
          for f in example/*.doxa; do
            /tmp/doxa check "$f" || exit 1
          done

      - name: Build WASM
        working-directory: ./doxa_tooling
        run: dart compile wasm web/doxa_check.dart -o web/doxa_check.wasm

  # --- VSCode extension ---
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./editors/vscode
        run: npm ci

      - name: Bundle with esbuild
        working-directory: ./editors/vscode
        run: npm run esbuild

      - name: Package extension
        working-directory: ./editors/vscode
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxa-vscode
          path: editors/vscode/*.vsix

  # --- JetBrains plugin ---
  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: ./editors/jetbrains
        run: ./gradlew buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxa-jetbrains
          path: editors/jetbrains/build/distributions/*.zip

  # --- pana score ---
  pub-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pana score (doxa kernel)
        run: |
          dart pub global activate pana
          pana doxa/ --no-warning --exit-code-threshold 0 2>&1 | tail -20

      - name: pana score (doxa_tooling)
        run: |
          pana doxa_tooling/ --no-warning --source path --exit-code-threshold 0 2>&1 | tail -20 || true
