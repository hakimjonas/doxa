name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (doxa core)
        working-directory: ./doxa
        run: dart pub get

      - name: Install dependencies (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart pub get

      - name: Analyze (doxa core)
        working-directory: ./doxa
        run: dart analyze --no-fatal-warnings

      - name: Analyze (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart analyze --no-fatal-warnings

      - name: Test (doxa core)
        working-directory: ./doxa
        run: dart test

      - name: Test (doxa_tooling)
        working-directory: ./doxa_tooling
        run: dart test

      - name: Format check (Dart)
        run: dart format --set-exit-if-changed doxa/ doxa_tooling/

      - name: Build doxa CLI
        working-directory: ./doxa_tooling
        run: dart compile exe bin/doxa.dart -o /tmp/doxa

      - name: doxa fmt --check (all .doxa files)
        run: |
          for f in $(find lib/stdlib example doxa_tooling/test/programs -name '*.doxa' -type f); do
            /tmp/doxa fmt --check "$f" || exit 1
          done

      - name: doxa type-check (stdlib)
        run: |
          # Int/package.doxa is excluded — match motive inference fails
          # in import chains (separate bug, tracked for 0.8.x).
          for f in $(find lib/stdlib -name '*.doxa' -type f ! -name 'prelude.doxa' ! -path '*/Int/package.doxa'); do
            /tmp/doxa check "$f" || exit 1
          done

      - name: doxa type-check (examples)
        run: |
          for f in example/*.doxa; do
            /tmp/doxa check "$f" || exit 1
          done

      - name: Build WASM
        working-directory: ./doxa_tooling
        run: dart compile wasm web/doxa_check.dart -o web/doxa_check.wasm

      - name: Check pub.dev score (doxa)
        working-directory: ./doxa
        run: |
          dart pub global activate pana
          pana . --no-warning --exit-code-threshold 0 2>&1 | tail -20

      - name: Check pub.dev score (doxa_tooling)
        working-directory: ./doxa_tooling
        run: |
          # pana needs doxa published to pub.dev first.
          # Once doxa is published, remove --source path.
          pana . --no-warning --source path --exit-code-threshold 0 2>&1 | tail -20 || true
