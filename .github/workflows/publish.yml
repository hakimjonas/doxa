name: Publish

# External publication is manual, explicit, and irreversible. A version tag
# never publishes: release.yml builds the GitHub release and nothing else.
# If pub.dev uses trusted publishing, the package's trusted publisher entry
# must name this workflow file (publish.yml), not release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.8.5. Must match VERSION.'
        required: true
      confirm:
        description: 'Type PUBLISH to confirm the external publish.'
        required: true
      pub_dev:
        description: 'Publish doxa, doxa_tooling, and doxa_stdlib to pub.dev.'
        type: boolean
        default: false
      vscode:
        description: 'Publish the VS Code extension.'
        type: boolean
        default: false
      jetbrains:
        description: 'Publish the JetBrains plugin.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Every dispatch passes through this gate. The two repository variables
  # are unset by default, so a fresh repository cannot publish even when a
  # dispatch asks for a target:
  #
  # - ALLOW_PUB_DEV_PUBLISH exists because the pub.dev hold is a standing
  #   policy independent of any one release. It covers all three pub.dev
  #   packages: doxa, doxa_tooling, and doxa_stdlib.
  # - ALLOW_MARKETPLACE_PUBLISH exists because the editor marketplaces are
  #   external and irreversible in the same way.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1

      - name: Install lam
        run: |
          dart pub global activate lambe 0.14.0
          "$HOME/.pub-cache/bin/lam" --version
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Check the confirmation and the publication holds
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          TAG: ${{ github.event.inputs.tag }}
          PUB_DEV: ${{ github.event.inputs.pub_dev }}
          VSCODE: ${{ github.event.inputs.vscode }}
          JETBRAINS: ${{ github.event.inputs.jetbrains }}
          ALLOW_PUB_DEV: ${{ vars.ALLOW_PUB_DEV_PUBLISH }}
          ALLOW_MARKETPLACE: ${{ vars.ALLOW_MARKETPLACE_PUBLISH }}
        run: |
          set -euo pipefail

          # An unset repository variable reaches the job as an empty
          # string, so bind every read to an empty default.
          if [ "${CONFIRM:-}" != "PUBLISH" ]; then
            echo "confirmation missing: type PUBLISH in the confirm input to publish." >&2
            exit 1
          fi

          version="$(cat VERSION)"
          if [ "v$version" != "${TAG:-}" ]; then
            echo "tag mismatch: the tag input is ${TAG:-} but VERSION is $version." >&2
            exit 1
          fi

          if [ "${PUB_DEV:-}" != "true" ] \
            && [ "${VSCODE:-}" != "true" ] \
            && [ "${JETBRAINS:-}" != "true" ]; then
            echo "no target selected: set at least one of pub_dev, vscode, or jetbrains." >&2
            exit 1
          fi

          if [ "${PUB_DEV:-}" = "true" ] && [ "${ALLOW_PUB_DEV:-}" != "true" ]; then
            echo "pub.dev is on hold: set the ALLOW_PUB_DEV_PUBLISH repository variable to true to allow publishing the three packages." >&2
            exit 1
          fi

          if { [ "${VSCODE:-}" = "true" ] || [ "${JETBRAINS:-}" = "true" ]; } \
            && [ "${ALLOW_MARKETPLACE:-}" != "true" ]; then
            echo "the editor marketplaces are on hold: set the ALLOW_MARKETPLACE_PUBLISH repository variable to true to allow this publish." >&2
            exit 1
          fi

      # A retracted kernel version needs a version bump before any publish,
      # whichever target the dispatch selects. An unreachable API, an empty
      # body, or a failed query fails the gate: none of them may bypass it.
      - name: Refuse a retracted kernel version
        run: |
          version="$(cat VERSION)"
          if ! body="$(curl -fsS --max-time 30 https://pub.dev/api/packages/doxa)"; then
            echo "cannot read the doxa package from pub.dev; refusing to publish without the retracted-version check." >&2
            exit 1
          fi
          if [ -z "$body" ]; then
            echo "empty doxa package response from pub.dev; refusing to publish." >&2
            exit 1
          fi
          result="$(printf '%s' "$body" | lam -r \
            "(.versions | filter(.version == \"$version\" && .retracted == true) | length) > 0" \
            2>/dev/null)"
          if [ "$result" != "true" ] && [ "$result" != "false" ]; then
            echo "the lam retracted check failed; refusing to publish." >&2
            exit 1
          fi
          if [ "$result" = "true" ]; then
            echo "doxa $version is retracted on pub.dev; bump VERSION before publishing." >&2
            exit 1
          fi

  pub-dev:
    needs: [preflight]
    if: github.event.inputs.pub_dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the local dev SDK (see ci.yml).
          sdk: 3.13.1

      - name: Install lam
        run: |
          dart pub global activate lambe 0.14.0
          "$HOME/.pub-cache/bin/lam" --version
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Publish to pub.dev (doxa kernel)
        run: |
          is_published() {
            local package="$1"
            local version="$2"
            local body result
            if ! body="$(curl -fsS --max-time 30 "https://pub.dev/api/packages/$package")"; then
              return 1
            fi
            result="$(printf '%s' "$body" | lam -r \
              "(.versions | filter(.version == \"$version\") | length) > 0" 2>/dev/null)"
            [ "$result" = "true" ]
          }

          version="$(cat VERSION)"
          if is_published doxa "$version"; then
            echo "doxa $version is already published; skipping."
          else
            dart pub publish --directory doxa/ --force
          fi

      - name: Publish to pub.dev (doxa_tooling)
        run: |
          is_published() {
            local package="$1"
            local version="$2"
            local body result
            if ! body="$(curl -fsS --max-time 30 "https://pub.dev/api/packages/$package")"; then
              return 1
            fi
            result="$(printf '%s' "$body" | lam -r \
              "(.versions | filter(.version == \"$version\") | length) > 0" 2>/dev/null)"
            [ "$result" = "true" ]
          }

          version="$(cat VERSION)"
          if is_published doxa_tooling "$version"; then
            echo "doxa_tooling $version is already published; skipping."
            exit 0
          fi

          # The tooling publish resolves doxa from pub.dev. Poll the
          # kernel index briefly after a fresh publish.
          for attempt in $(seq 1 12); do
            if is_published doxa "$version"; then
              break
            fi
            echo "waiting for doxa $version in the pub.dev index (attempt $attempt/12)."
            sleep 10
          done

          attempt=1
          until dart pub publish --directory doxa_tooling/ --force; do
            if [ "$attempt" -ge 6 ]; then
              echo "doxa_tooling publish failed after $attempt attempts." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "doxa_tooling publish failed; retrying in 10s (attempt $attempt/6)."
            sleep 10
          done

      - name: Publish to pub.dev (doxa_stdlib)
        run: |
          is_published() {
            local package="$1"
            local version="$2"
            local body result
            if ! body="$(curl -fsS --max-time 30 "https://pub.dev/api/packages/$package")"; then
              return 1
            fi
            result="$(printf '%s' "$body" | lam -r \
              "(.versions | filter(.version == \"$version\") | length) > 0" 2>/dev/null)"
            [ "$result" = "true" ]
          }

          version="$(cat VERSION)"
          if is_published doxa_stdlib "$version"; then
            echo "doxa_stdlib $version is already published; skipping."
            exit 0
          fi

          # The stdlib package declares no dependency on the kernel or the
          # tooling, so it can publish regardless of their index state.
          dart pub publish --directory doxa_stdlib/ --force

      # Run immediately after all three publishes. If pub.dev's package
      # index has not caught up, rerun the job; do not remove this gate.
      - name: pana score (published)
        run: |
          dart pub global activate pana
          attempt=1
          until pana doxa/ --source hosted --exit-code-threshold 0 \
            && pana doxa_tooling/ --source hosted --exit-code-threshold 0 \
            && pana doxa_stdlib/ --source hosted --exit-code-threshold 0; do
            if [ "$attempt" -ge 12 ]; then
              echo "pana gate failed after $attempt attempts." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "pana failed; retrying in 10s (attempt $attempt/12)."
            sleep 10
          done

  vscode:
    needs: [preflight]
    if: github.event.inputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./editors/vscode
        run: npm ci

      - name: Package and publish
        working-directory: ./editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce package
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set; packaged the extension but skipped publication."
            exit 0
          fi
          npx @vscode/vsce publish

  jetbrains:
    needs: [preflight]
    if: github.event.inputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and publish
        working-directory: ./editors/jetbrains
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "JETBRAINS_MARKETPLACE_TOKEN not set; skipping plugin publication."
            exit 0
          fi
          ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
